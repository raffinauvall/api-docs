name: CI

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/vps_key"
          chmod 600 "$HOME/.ssh/vps_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/var/www/api-docs' }}
        run: |
          ssh -i "$HOME/.ssh/vps_key" "$VPS_USER@$VPS_HOST" bash -s -- "$APP_DIR" <<'REMOTE'
          set -eu
          APP_DIR="$1"
          cd "$APP_DIR"
          git pull --ff-only origin main
          npm ci
          npm ci --prefix client
          npm ci --prefix server
          npm run build
          pm2 restart api-docs
          REMOTE
